name: Update match results

on:
  schedule:
    # Every 2 hours, on the :12 to avoid the top-of-hour congestion most
    # scheduled workflows pile onto. GitHub may delay a run by a few minutes
    # under load; that's fine here, results aren't time-critical.
    - cron: "12 */2 * * *"
  workflow_dispatch: {}

concurrency:
  # If a run ever takes long enough to overlap the next scheduled trigger,
  # queue it instead of scraping Flashscore from two runs in parallel.
  group: results-update
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright (this job only — not part of the app's dependencies)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Run results update
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/update-results.ts
