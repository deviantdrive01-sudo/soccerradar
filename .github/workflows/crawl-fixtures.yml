name: Crawl fixtures

on:
  schedule:
    # Every 2 hours, offset from results-update (:12) and generate-predictions
    # (:43) so the three don't pile onto the same runner queue slot.
    - cron: "13 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: crawl-fixtures
  cancel-in-progress: false

jobs:
  crawl-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright (this job only — not part of the app's dependencies)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Run fixture crawl
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/crawl-fixtures.ts
